<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타이핑 속도 테스트</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/common.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js" integrity="sha384-dok87au0gKqJdxs7msEdBPNnKSRT+/mhTVzq+qOhcL464zXwvcrpjeWvyj1kCdq6" crossorigin="anonymous"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7637874916831135"
     crossorigin="anonymous"></script>
</head>
<body class="et-dark">
    <!-- 홈 버튼 -->
    <a href="../index.html" class="et-home-btn">
        <i class="fas fa-home"></i> <span data-i18n="backToHome">홈으로</span>
    </a>

    <div class="container">
        <header>
            <h1 data-i18n="typingTest">🚀 타이핑 속도 테스트</h1>
            <p data-i18n="typingDesc">아래 문장을 정확히 타이핑해보세요!</p>
        </header>

        <main>
            <div class="stats-container">
                <div class="stat">
                    <div class="stat-value" id="wpm">0</div>
                    <div class="stat-label">WPM</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="accuracy">100</div>
                    <div class="stat-label" data-i18n="accuracy">정확도(%)</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="timer">0</div>
                    <div class="stat-label" data-i18n="time">시간(초)</div>
                </div>
            </div>

            <div class="text-container">
                <div id="target-text" class="target-text"></div>
            </div>

            <div class="input-container">
                <textarea
                    id="typing-input"
                    data-i18n="typingPlaceholder"
                    placeholder="타이핑을 시작하면 자동으로 테스트가 시작됩니다..."
                ></textarea>
            </div>

            <div id="challengeBanner" class="hidden mb-6 p-4 glass-content rounded-lg border border-yellow-500 border-opacity-30">
                <div class="text-center">
                    <i class="fas fa-trophy text-3xl text-yellow-500 mb-2"></i>
                    <h3 class="font-bold text-white" data-i18n="challengeReceived">도전장을 받았습니다!</h3>
                    <p class="text-sm text-gray-400 mt-1" data-i18n="challengeReceivedDesc">같은 조건으로 도전에 응해보세요!</p>
                    <p class="text-lg font-bold text-yellow-400 mt-2"><span data-i18n="challengeOpponent">상대방</span>: <span id="opponentScorePreview">-</span></p>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn primary" data-i18n="startTest">테스트 시작</button>
                <button id="reset-btn" class="btn secondary" data-i18n="tryAgain">다시 시작</button>
                <div id="share-buttons" class="share-buttons" style="display: none;">
                    <button id="kakao-share-btn" class="btn kakao"><span data-i18n="kakaoShare">카카오톡 공유</span></button>
                    <button id="facebook-share-btn" class="btn facebook"><span data-i18n="facebookShare">페이스북 공유</span></button>
                </div>
            </div>

            <div id="result-container" class="result-container" style="display: none;">
                <h2 data-i18n="testComplete">🎉 테스트 완료!</h2>
                <div class="final-stats">
                    <div class="final-stat">
                        <span class="label" data-i18n="typingSpeedLabel">타이핑 속도:</span>
                        <span id="final-wpm" class="value">0 WPM</span>
                    </div>
                    <div class="final-stat">
                        <span class="label" data-i18n="accuracyLabel">정확도:</span>
                        <span id="final-accuracy" class="value">100%</span>
                    </div>
                    <div class="final-stat">
                        <span class="label" data-i18n="timeLabel">소요 시간:</span>
                        <span id="final-time" class="value">0초</span>
                    </div>
                </div>

                <div id="challengeSection" class="mt-6 p-4 glass-content rounded-lg">
                    <h3 class="font-bold mb-2 text-center text-white" data-i18n="challengeFriend">친구에게 도전하기</h3>
                    <p class="text-sm text-gray-400 text-center mb-4" data-i18n="challengeDesc">같은 조건으로 친구에게 도전장을 보내세요!</p>
                    <div class="flex gap-2 justify-center">
                        <button id="createChallengeBtn" class="et-btn et-btn-accent">
                            <i class="fas fa-trophy mr-2"></i><span data-i18n="createChallengeLink">도전 링크 만들기</span>
                        </button>
                    </div>
                    <div id="challengeLinkContainer" class="hidden mt-3">
                        <div class="flex gap-2">
                            <input id="challengeLink" type="text" readonly class="flex-1 p-2 rounded bg-white bg-opacity-10 text-white text-sm border border-gray-600">
                            <button id="copyChallengeLink" class="et-btn et-btn-ghost text-sm"><i class="fas fa-copy"></i></button>
                        </div>
                        <p id="copySuccessMessage" class="hidden text-sm text-green-400 text-center mt-2"></p>
                    </div>
                </div>

                <div id="challengeComparison" class="hidden mt-6">
                    <h3 class="font-bold mb-4 text-center text-white" data-i18n="challengeResult">도전 결과</h3>
                    <div style="display:flex;align-items:center;justify-content:center;gap:24px;">
                        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 24px;background:rgba(255,255,255,0.04);border-radius:12px;min-width:120px;" id="opponentSide">
                            <span class="text-sm text-gray-400" data-i18n="challengeOpponent">상대방</span>
                            <span id="compOpponentScore" class="text-2xl font-bold text-white">-</span>
                        </div>
                        <div style="font-size:24px;font-weight:800;color:rgba(255,255,255,0.3);">VS</div>
                        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 24px;background:rgba(255,255,255,0.04);border-radius:12px;min-width:120px;" id="mySide">
                            <span class="text-sm text-gray-400" data-i18n="you">당신</span>
                            <span id="compMyScore" class="text-2xl font-bold text-white">-</span>
                        </div>
                    </div>
                    <p id="challengeResultText" class="text-center mt-4 text-xl font-bold"></p>
                </div>
            </div>

            <div class="custom-text-container">
                <label for="custom-text-input" data-i18n="customTestLabel">내 맘대로 테스트</label>
                <textarea
                    id="custom-text-input"
                    data-i18n="customTextPlaceholder"
                    placeholder="원하는 텍스트를 입력하세요 (비워두면 기본 문장 사용)"
                    rows="3"
                ></textarea>
                <button id="apply-custom-text" class="btn secondary" data-i18n="applyText">텍스트 적용</button>
            </div>
        </main>
    </div>

    <footer class="et-footer">
        <p>EasyTest &copy; 2024</p>
    </footer>

    <!-- 다국어 시스템 로드 -->
    <script src="../js/i18n.js?v=2"></script>
    <script src="../js/challenge.js?v=2"></script>
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script src="script.js?v=2"></script>
    <!-- 카카오 SDK 초기화 -->
    <script>
        // Kakao SDK 초기화
        try {
            if (typeof Kakao !== 'undefined' && Kakao) {
                // 실제 카카오 앱 키로 교체 필요
                // 카카오 개발자 사이트 (https://developers.kakao.com)에서 앱 등록 후 발급받은 JavaScript 키 사용
                Kakao.init('eb68697db572e7c6b4abbf70207a69a1'); // 여기에 실제 JavaScript 키를 입력하세요
                console.log('Kakao SDK 초기화 완료');
                console.log('Kakao 앱 키 상태:', Kakao.isInitialized());
            } else {
                console.log('Kakao SDK가 로드되지 않았습니다');
            }
        } catch (e) {
            console.log('Kakao SDK 초기화 실패:', e);
        }
    </script>
</body>
</html>
